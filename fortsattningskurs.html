<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortsättningskurs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Fortsättningskurs</h1>
        <p>Klicka på ett tillfälle för att se detaljer:</p>
        
        <div class="course-links">
            <a href="#session1" onclick="showSession(1)">Tillfälle 1</a>
            <a href="#session2" onclick="showSession(2)">Tillfälle 2</a>
            <a href="#session3" onclick="showSession(3)">Tillfälle 3</a>
            <a href="#session4" onclick="showSession(4)">Tillfälle 4</a>
            <a href="#session5" onclick="showSession(5)">Tillfälle 5</a>
        </div>
        
        <div id="session-details" class="session-details" style="margin-top: 20px;">
            <h2 id="session-title"></h2>
            <p id="session-description"></p>
        </div>
    </div>
    
    <footer>
        <a href="index.html">&larr; Tillbaka till startsidan</a>
    </footer>

    <script>
        const sessions = {
            1: {
                title: "Tillfälle 1: Fördjupning av grunder",
                description: `
                    <ul>
                        <li>18.00–18.10: Uppvärmning</li>
                        <li>18.10–18.40: Precision i positioner</li>
                        <li>18.40–19.00: Trick: Cirkla runt föraren</li>
                        <li>19.00–19.20: Teori: Belöningsplacering</li>
                        <li>19.20–19.30: Hemläxa</li>
                    </ul>
                    <strong>Hemläxa:</strong> Träna cirklar och flyt mellan positioner.
                `
            },
            2: {
                title: "Tillfälle 2: Kedjning av beteenden",
                description: `
                    <ul>
                        <li>18.00–18.10: Uppvärmning och repetition</li>
                        <li>18.10–18.40: Kedja trick och positioner</li>
                        <li>18.40–19.00: Avståndsarbete</li>
                        <li>19.00–19.20: Teori: Timing och kedjning</li>
                        <li>19.20–19.30: Avslutning och hemläxa</li>
                    </ul>
                    <strong>Hemläxa:</strong> Kedja tre trick och arbeta på avstånd.
                `
            },
            3: {
                title: "Tillfälle 3: Dynamik och variation",
                description: `
                    <ul>
                        <li>18.00–18.10: Uppvärmning</li>
                        <li>18.10–18.30: Variation i tempo</li>
                        <li>18.30–18.50: Trick: Backa runt föraren</li>
                        <li>18.50–19.10: Teori: Skapa variation i program</li>
                        <li>19.10–19.30: Hemläxa</li>
                    </ul>
                    <strong>Hemläxa:</strong> Träna variation och dynamik i sekvenser.
                `
            },
            4: {
                title: "Tillfälle 4: Sätta ihop program",
                description: `
                    <ul>
                        <li>18.00–18.10: Uppvärmning och repetition</li>
                        <li>18.10–18.40: Skapa sekvenser</li>
                        <li>18.40–19.10: Testa sekvenser med musik</li>
                        <li>19.10–19.30: Feedback och justeringar</li>
                    </ul>
                    <strong>Hemläxa:</strong> Finslipa ett 1-minutsprogram.
                `
            },
            5: {
                title: "Tillfälle 5: Uppvisning",
                description: `
                    <ul>
                        <li>18.00–18.10: Uppvärmning</li>
                        <li>18.10–19.00: Visa program</li>
                        <li>19.00–19.20: Gruppfeedback</li>
                        <li>19.20–19.30: Avslutning</li>
                    </ul>
                    <strong>Hemläxa:</strong> Planera vidare träning.
                `
            }
        };

        function showSession(sessionId) {
            const sessionDetails = document.getElementById("session-details");
            const sessionTitle = document.getElementById("session-title");
            const sessionDescription = document.getElementById("session-description");

            const session = sessions[sessionId];
            sessionTitle.innerHTML = session.title;
            sessionDescription.innerHTML = session.description;

            sessionDetails.style.display = "block";
        }
    </script>
</body>
</html>
