<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nybörjarkurs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1, h2 {
            text-align: center;
        }
        .session-list {
            margin: 20px 0;
            text-align: center;
        }
        .session-content {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .hidden {
            display: none;
        }
        button {
            margin: 5px;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Nybörjarkurs</h1>
    <p>Klicka på ett tillfälle för att se detaljer:</p>
    <div class="session-list">
        <button onclick="showSession(1)">Tillfälle 1</button>
        <button onclick="showSession(2)">Tillfälle 2</button>
        <button onclick="showSession(3)">Tillfälle 3</button>
        <button onclick="showSession(4)">Tillfälle 4</button>
        <button onclick="showSession(5)">Tillfälle 5</button>
    </div>
    <div id="session-content" class="session-content hidden"></div>

    <script>
        const courseData = {
            1: {
                title: "Tillfälle 1: Introduktion och grunder",
                schedule: [
                    "18.00–18.10: Introduktion",
                    "18.10–18.40: Grundpositioner (Front, höger sida)",
                    "18.40–19.00: Trick: Snurra höger/vänster",
                    "19.00–19.20: Teori: Shaping, belöningsplacering",
                    "19.20–19.30: Avslutning och hemläxa"
                ],
                homework: "Träna in Front och höger sida samt snurra höger/vänster."
            },
            // Lägg till de andra tillfällena som tidigare
        };

        function showSession(sessionId) {
            const session = courseData[sessionId];
            const sessionContent = document.getElementById("session-content");
            
            sessionContent.innerHTML = `
                <h2>${session.title}</h2>
                <h3>Tidsplan:</h3>
                <ul>
                    ${session.schedule.map(item => `<li>${item}</li>`).join("")}
                </ul>
                <h3>Hemläxa:</h3>
                <p>${session.homework}</p>
            `;
            sessionContent.classList.remove("hidden");
        }
    </script>
</body>
</html>
