<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kursadministration</title>
    <style>
        /* Grundinställningar */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #FF7EB3, #8E44AD);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        /* Container */
        .container {
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* Rubrik */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* Text */
        p {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Kursknappar */
        .course-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .course-links a {
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            padding: 15px 20px;
            border-radius: 10px;
            background: linear-gradient(135deg, #3498DB, #2ECC71);
            color: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            width: 100%;
            max-width: 200px;
            text-align: center;
        }

        .course-links a:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5);
        }

        /* Footer */
        footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        footer a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Responsiv design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            p {
                font-size: 1rem;
            }

            .course-links a {
                max-width: 100%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kursadministration</h1>
        <p>Välj en kurs nedan för att administrera deltagare och anteckningar:</p>
        
        <div class="course-links">
            <a href="traningssystem.html">Nybörjarkurs</a>
            <a href="nyinlarning.html">Fortsättningskurs</a>
            <a href="monsterinlarning.html">Avancerad Kurs</a>
            <a href="specialkurs.html">Specialkurs</a>
            <a href="forberedelse.html">Kursadministration</a>
        </div>
    </div>
    
    <footer>
        &copy; 2025 Kursadministration | <a href="kontakt.html">Kontakta oss</a>
    </footer>
</body>
</html>
