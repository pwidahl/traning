<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nybörjarkurs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f9f9f9;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 1.5rem;
        }

        button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #007BFF;
            color: white;
        }

        button:hover {
            background: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background: #f4f4f4;
            font-weight: bold;
        }

        td input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        .save-button {
            background: #28a745;
        }

        .save-button:hover {
            background: #218838;
        }

        .reset-button {
            background: #dc3545;
        }

        .reset-button:hover {
            background: #c82333;
        }

        /* Mobilanpassning */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.3rem;
            }

            table {
                font-size: 0.9rem;
            }

            td input, textarea {
                font-size: 0.9rem;
                padding: 8px;
            }

            button {
                font-size: 0.9rem;
                padding: 8px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            h1 {
                font-size: 1rem;
            }

            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }

            td input, textarea {
                font-size: 0.8rem;
                padding: 6px;
            }

            button {
                font-size: 0.8rem;
                padding: 6px;
            }

            th, td {
                padding: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nybörjarkurs</h1>
        <p>Klicka på ett tillfälle för att redigera kursplanen:</p>

        <div>
            <button onclick="showSession(1)">Tillfälle 1</button>
            <button onclick="showSession(2)">Tillfälle 2</button>
            <button onclick="showSession(3)">Tillfälle 3</button>
            <button onclick="showSession(4)">Tillfälle 4</button>
            <button onclick="showSession(5)">Tillfälle 5</button>
        </div>
        
        <div style="margin-top: 20px; text-align: center;">
    <a href="index.html" style="
        display: inline-block;
        padding: 6px 20px;
        background: #007BFF;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-size: 1rem;
        transition: background 0.3s ease;">
        ← Tillbaka till startsidan
    </a>
</div>

        <div id="session-details" style="display: none; margin-top: 20px;">
            <h2 id="session-title"></h2>
            <h3>Tidsplan:</h3>
            <table id="schedule-table">
                <thead>
                    <tr>
                        <th>Tid</th>
                        <th>Innehåll</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <button class="save-button" onclick="addRow()">Lägg till rad</button>

            <h3>Anteckningar:</h3>
            <textarea id="session-notes" rows="5" placeholder="Skriv anteckningar här..."></textarea>
            <button class="save-button" onclick="saveSession()">Spara</button>
            <button class="reset-button" onclick="resetSession()">Återställ till ursprung</button>
        </div>
    </div>

    <script>
        const defaultSessions = {
            1: {
                title: "Tillfälle 1: Introduktion och grunder",
                schedule: [
                    { time: "18:00–18:10", content: "Introduktion" },
                    { time: "18:10–18:30", content: "Grundpositioner: Front, höger sida" },
                    { time: "18:30–18:50", content: "Trick: Snurra höger och vänster" },
                    { time: "18:50–19:10", content: "Teori: Shaping och belöningsplacering" },
                    { time: "19:10–19:30", content: "Frågor och hemläxa" }
                ],
                notes: ""
            },
            2: {
                title: "Tillfälle 2: Fördjupning",
                schedule: [
                    { time: "18:00–18:10", content: "Repetition och uppvärmning" },
                    { time: "18:10–18:30", content: "Grundpositioner: Vänster sida och bakom" },
                    { time: "18:30–18:50", content: "Trick: Slalom framåt och bakåt" },
                    { time: "18:50–19:10", content: "Teori: Ordförståelse och timing" },
                    { time: "19:10–19:30", content: "Avslut och hemläxa" }
                ],
                notes: ""
            },
            3: {
                title: "Tillfälle 3: Fördjupning",
                schedule: [
                    { time: "18:00–18:10", content: "Repetition och uppvärmning" },
                    { time: "18:10–18:30", content: "Grundpositioner: Vänster sida och bakom" },
                    { time: "18:30–18:50", content: "Trick: Slalom framåt och bakåt" },
                    { time: "18:50–19:10", content: "Teori: Ordförståelse och timing" },
                    { time: "19:10–19:30", content: "Avslut och hemläxa" }
                ],
                notes: ""
            },
            4: {
                title: "Tillfälle 4: Fördjupning",
                schedule: [
                    { time: "18:00–18:10", content: "Repetition och uppvärmning" },
                    { time: "18:10–18:30", content: "Grundpositioner: Vänster sida och bakom" },
                    { time: "18:30–18:50", content: "Trick: Slalom framåt och bakåt" },
                    { time: "18:50–19:10", content: "Teori: Ordförståelse och timing" },
                    { time: "19:10–19:30", content: "Avslut och hemläxa" }
                ],
                notes: ""
            },
            5: {
                title: "Tillfälle 5: Fördjupning",
                schedule: [
                    { time: "18:00–18:10", content: "Repetition och uppvärmning" },
                    { time: "18:10–18:30", content: "Grundpositioner: Vänster sida och bakom" },
                    { time: "18:30–18:50", content: "Trick: Slalom framåt och bakåt" },
                    { time: "18:50–19:10", content: "Teori: Ordförståelse och timing" },
                    { time: "19:10–19:30", content: "Avslut och hemläxa" }
                ],
                notes: ""
            }
        };

        let sessions = JSON.parse(JSON.stringify(defaultSessions));

        function showSession(sessionId) {
            const session = sessions[sessionId];
            document.getElementById("session-title").innerText = session.title;
            document.getElementById("session-notes").value = session.notes;

            const tableBody = document.getElementById("schedule-table").querySelector("tbody");
            tableBody.innerHTML = "";

            session.schedule.forEach((item, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td><input type="text" value="${item.time}" onchange="updateTime(${sessionId}, ${index}, this.value)"></td>
                    <td><input type="text" value="${item.content}" onchange="updateContent(${sessionId}, ${index}, this.value)"></td>
                `;
                tableBody.appendChild(row);
            });

            document.getElementById("session-details").style.display = "block";
        }

        function updateTime(sessionId, index, value) {
            sessions[sessionId].schedule[index].time = value;
        }

        function updateContent(sessionId, index, value) {
            sessions[sessionId].schedule[index].content = value;
        }

        function addRow() {
            const sessionId = Object.keys(defaultSessions).find(
                id => defaultSessions[id].title === document.getElementById("session-title").innerText
            );
            sessions[sessionId].schedule.push({ time: "", content: "" });
            showSession(sessionId);
        }

        function saveSession() {
            const sessionId = Object.keys(defaultSessions).find(
                id => defaultSessions[id].title === document.getElementById("session-title").innerText
            );
            sessions[sessionId].notes = document.getElementById("session-notes").value;
            alert("Ändringar sparade!");
        }

        function resetSession() {
            if (confirm("Vill du återställa till ursprungligt innehåll?")) {
                sessions = JSON.parse(JSON.stringify(defaultSessions));
                alert("Tillfället har återställts!");
                location.reload();
            }
        }
    </script>
</body>
</html>
