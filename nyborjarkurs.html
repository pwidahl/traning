<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nybörjarkurs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Nybörjarkurs</h1>
        <p>Klicka på ett tillfälle för att se detaljer:</p>
        
        <div class="course-links">
            <a href="#session1" onclick="showSession(1)">Tillfälle 1</a>
            <a href="#session2" onclick="showSession(2)">Tillfälle 2</a>
            <a href="#session3" onclick="showSession(3)">Tillfälle 3</a>
            <a href="#session4" onclick="showSession(4)">Tillfälle 4</a>
            <a href="#session5" onclick="showSession(5)">Tillfälle 5</a>
        </div>
        
        <div id="session-details" class="session-details" style="margin-top: 20px;">
            <h2 id="session-title"></h2>
            <p id="session-description"></p>
        </div>
    </div>
    
    <footer>
        <a href="index.html">&larr; Tillbaka till startsidan</a>
    </footer>

    <script>
        const sessions = {
            1: {
                title: "Tillfälle 1: Introduktion och grunder",
                description: `
                    <ul>
                        <li>18.00–18.10: Introduktion</li>
                        <li>18.10–18.40: Grundpositioner (Front, höger sida)</li>
                        <li>18.40–19.00: Trick: Snurra höger/vänster</li>
                        <li>19.00–19.20: Teori: Shaping och belöningsplacering</li>
                        <li>19.20–19.30: Avslutning och hemläxa</li>
                    </ul>
                    <strong>Hemläxa:</strong> Träna in Front och höger sida samt snurra höger/vänster.
                `
            },
            2: {
                title: "Tillfälle 2: Fördjupning av positioner och rörelse",
                description: `
                    <ul>
                        <li>18.00–18.10: Uppvärmning och repetition</li>
                        <li>18.10–18.30: Grundpositioner: Vänster sida, bakom</li>
                        <li>18.30–18.50: Trick: Slalom framåt/bakåt</li>
                        <li>18.50–19.10: Teori: Ordförståelse och muskelminne</li>
                        <li>19.10–19.30: Avslutning och hemläxa</li>
                    </ul>
                    <strong>Hemläxa:</strong> Träna slalom och positionerna vänster sida och bakom.
                `
            },
            3: {
                title: "Tillfälle 3: Bygga komplexitet",
                description: `
                    <ul>
                        <li>18.00–18.10: Uppvärmning och repetition</li>
                        <li>18.10–18.30: Trick: Backa</li>
                        <li>18.30–18.50: Trick: Sitt fint och buga</li>
                        <li>18.50–19.10: Kombinera positioner och trick</li>
                        <li>19.10–19.30: Teori och avslutning</li>
                    </ul>
                    <strong>Hemläxa:</strong> Träna korta sekvenser med kombinationer av positioner och trick.
                `
            },
            4: {
                title: "Tillfälle 4: Sätta samman rörelser och program",
                description: `
                    <ul>
                        <li>18.00–18.10: Uppvärmning och repetition</li>
                        <li>18.10–18.40: Kedja rörelser</li>
                        <li>18.40–19.10: Förbered program</li>
                        <li>19.10–19.30: Teori och feedback</li>
                    </ul>
                    <strong>Hemläxa:</strong> Sätt ihop en sekvens på 30-45 sekunder till musik.
                `
            },
            5: {
                title: "Tillfälle 5: Uppvisning och avslutning",
                description: `
                    <ul>
                        <li>18.00–18.10: Uppvärmning och repetition</li>
                        <li>18.10–19.00: Varje ekipage visar sitt program</li>
                        <li>19.00–19.20: Reflektion och feedback</li>
                        <li>19.20–19.30: Avslutning och gruppfoto</li>
                    </ul>
                    <strong>Hemläxa:</strong> Reflektera över kursen och planera vidare träning.
                `
            }
        };

        function showSession(sessionId) {
            const sessionDetails = document.getElementById("session-details");
            const sessionTitle = document.getElementById("session-title");
            const sessionDescription = document.getElementById("session-description");

            const session = sessions[sessionId];
            sessionTitle.innerHTML = session.title;
            sessionDescription.innerHTML = session.description;

            sessionDetails.style.display = "block";
        }
    </script>
</body>
</html>
