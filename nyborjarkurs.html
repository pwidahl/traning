<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nybörjarkurs</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .reset-button {
            margin-top: 20px;
            background: #e63946;
            color: white;
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .reset-button:hover {
            background: #d62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nybörjarkurs</h1>
        <p>Klicka på ett tillfälle för att se och justera innehållet:</p>
        
        <div class="course-links">
            <a href="#session1" onclick="showSession(1)">Tillfälle 1</a>
            <a href="#session2" onclick="showSession(2)">Tillfälle 2</a>
            <a href="#session3" onclick="showSession(3)">Tillfälle 3</a>
            <a href="#session4" onclick="showSession(4)">Tillfälle 4</a>
            <a href="#session5" onclick="showSession(5)">Tillfälle 5</a>
        </div>
        
        <div id="session-details" class="session-details" style="display: none;">
            <h2 id="session-title"></h2>
            <h3>Tidsplan</h3>
            <ul id="schedule-list"></ul>
            <h3>Anteckningar:</h3>
            <textarea id="session-notes" rows="5" placeholder="Lägg till anteckningar här..."></textarea>
            <button onclick="saveSession()">Spara ändringar</button>
        </div>

        <button class="reset-button" onclick="resetToDefault()">Återställ till grund</button>
    </div>
    
    <footer>
        <a href="index.html">&larr; Tillbaka till startsidan</a>
    </footer>

    <script>
        // Standarddata för att återställa
        const defaultSessions = {
            1: {
                title: "Tillfälle 1: Introduktion och grunder",
                schedule: [
                    { time: "18.00–18.10", content: "Introduktion" },
                    { time: "18.10–18.40", content: "Grundpositioner (Front, höger sida)" },
                    { time: "18.40–19.00", content: "Trick: Snurra höger/vänster" },
                    { time: "19.00–19.20", content: "Teori: Shaping och belöningsplacering" },
                    { time: "19.20–19.30", content: "Avslutning och hemläxa" }
                ],
                notes: ""
            },
            2: {
                title: "Tillfälle 2: Fördjupning av positioner och rörelse",
                schedule: [
                    { time: "18.00–18.10", content: "Uppvärmning och repetition" },
                    { time: "18.10–18.30", content: "Grundpositioner: Vänster sida, bakom" },
                    { time: "18.30–18.50", content: "Trick: Slalom framåt/bakåt" },
                    { time: "18.50–19.10", content: "Teori: Ordförståelse och muskelminne" },
                    { time: "19.10–19.30", content: "Avslutning och hemläxa" }
                ],
                notes: ""
            },
            3: {
                title: "Tillfälle 3: Bygga komplexitet",
                schedule: [
                    { time: "18.00–18.10", content: "Uppvärmning och repetition" },
                    { time: "18.10–18.30", content: "Trick: Backa" },
                    { time: "18.30–18.50", content: "Trick: Sitt fint och buga" },
                    { time: "18.50–19.10", content: "Kombinera positioner och trick" },
                    { time: "19.10–19.30", content: "Teori och avslutning" }
                ],
                notes: ""
            },
            4: {
                title: "Tillfälle 4: Sätta samman rörelser och program",
                schedule: [
                    { time: "18.00–18.10", content: "Uppvärmning och repetition" },
                    { time: "18.10–18.40", content: "Kedja rörelser" },
                    { time: "18.40–19.10", content: "Förbered program" },
                    { time: "19.10–19.30", content: "Teori och feedback" }
                ],
                notes: ""
            },
            5: {
                title: "Tillfälle 5: Uppvisning och avslutning",
                schedule: [
                    { time: "18.00–18.10", content: "Uppvärmning och repetition" },
                    { time: "18.10–19.00", content: "Varje ekipage visar sitt program" },
                    { time: "19.00–19.20", content: "Reflektion och feedback" },
                    { time: "19.20–19.30", content: "Avslutning och gruppfoto" }
                ],
                notes: ""
            }
        };

        // Aktuell sessionsdata (med möjlighet att spara ändringar)
        const sessions = JSON.parse(localStorage.getItem('sessions')) || JSON.parse(JSON.stringify(defaultSessions));

        // Spara till LocalStorage
        function saveToLocalStorage() {
            localStorage.setItem('sessions', JSON.stringify(sessions));
        }

        // Visa sessionens detaljer
        function showSession(sessionId) {
            const session = sessions[sessionId];
            document.getElementById("session-title").innerText = session.title;
            document.getElementById("session-notes").value = session.notes || "";
            document.getElementById("session-details").dataset.currentSessionId = sessionId;
            updateSchedule(sessionId);
            document.getElementById("session-details").style.display = "block";
        }

        // Uppdatera tidsplanen
        function updateSchedule(sessionId) {
            const scheduleList = document.getElementById("schedule-list");
            scheduleList.innerHTML = ""; // Rensa tidigare lista
            const schedule = sessions[sessionId].schedule;

            schedule.forEach((item, index) => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <strong>${item.time}</strong>
                    <textarea 
                        class="content" 
                        onchange="updateContent(${sessionId}, ${index}, this.value)"
                    >${item.content}</textarea>
                `;
                scheduleList.appendChild(li);
            });
        }

        // Uppdatera innehållet i tidsplanen
        function updateContent(sessionId, index, value) {
            sessions[sessionId].schedule[index].content = value;
            saveToLocalStorage();
        }

        // Spara anteckningar
        function saveSession() {
            const sessionId = document.getElementById("session-details").dataset.currentSessionId;
            const updatedNotes = document.getElementById("session-notes").value;
            sessions[sessionId].notes = updatedNotes;
            saveToLocalStorage();
            alert("Ändringar sparade!");
        }

        // Återställ till grund
        function resetToDefault() {
            if (confirm("Vill du verkligen återställa alla tillfällen till grundinställningarna?")) {
                Object.keys(defaultSessions).forEach(sessionId => {
                    sessions[sessionId] = JSON.parse(JSON.stringify(defaultSessions[sessionId]));
                });
                saveToLocalStorage();
                alert("Alla tillfällen har återställts till grund.");
                location.reload(); // Uppdatera sidan
            }
        }
    </script>
</body>
</html>
