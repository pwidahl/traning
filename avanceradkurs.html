<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avancerad kurs</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <style>
        .back-button {
            background: #cccccc;
            color: #333;
            border: none;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            cursor: pointer;
            font-size: 0.95rem;
            width: 100%;
            max-width: 150px;
            text-align: center;
        }

        .back-button:hover {
            background: #aaaaaa;
        }

        .generate-pdf-button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
            cursor: pointer;
            font-size: 0.95rem;
            width: 100%;
        }

        .generate-pdf-button:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tillbaka-knapp -->
        <button class="back-button" onclick="goBack()">← Tillbaka</button>

        <h1>Avancerad kurs</h1>
        <p>Klicka på ett tillfälle för att se och justera innehållet:</p>
        
        <div class="course-links">
            <a href="#session1" onclick="showSession(1)">Tillfälle 1</a>
            <a href="#session2" onclick="showSession(2)">Tillfälle 2</a>
            <a href="#session3" onclick="showSession(3)">Tillfälle 3</a>
            <a href="#session4" onclick="showSession(4)">Tillfälle 4</a>
            <a href="#session5" onclick="showSession(5)">Tillfälle 5</a>
        </div>
        
        <div id="session-details" class="session-details" style="display: none;">
            <h2 id="session-title"></h2>
            <h3>Tidsplan</h3>
            <ul id="schedule-list"></ul>
            <h3>Anteckningar:</h3>
            <textarea id="session-notes" rows="5" placeholder="Lägg till anteckningar här..."></textarea>
            <button class="save-button" onclick="saveSession()">Spara ändringar</button>
        </div>

        <button class="reset-button" onclick="resetToDefault()">Återställ till grund</button>
        <button class="generate-pdf-button" onclick="generatePDF()">Generera PDF</button>
    </div>
    
    <footer>
        <p style="text-align: center; margin-top: 20px;">&copy; 2025 Kursadministration</p>
    </footer>

    <script>
        // Tillbaka-knapp funktion
        function goBack() {
            window.history.back();
        }

        // Standarddata för alla tillfällen
        const defaultSessions = {
            1: {
                title: "Tillfälle 1: Avancerade positioner och precision",
                schedule: [
                    { time: "18.00–18.10", content: "Introduktion och repetition av tidigare nivåer" },
                    { time: "18.10–18.40", content: "Avancerade positioner: Mellan, bakom i rörelse" },
                    { time: "18.40–19.00", content: "Trick: Backa i olika mönster (linje, cirkel)" },
                    { time: "19.00–19.20", content: "Teori: Timing och övergångar i avancerade sekvenser" },
                    { time: "19.20–19.30", content: "Avslutning och hemläxa" }
                ],
                notes: ""
            },
            2: {
                title: "Tillfälle 2: Programuppbyggnad och övergångar",
                schedule: [
                    { time: "18.00–18.10", content: "Repetition av avancerade positioner" },
                    { time: "18.10–18.40", content: "Övergångar mellan avancerade positioner" },
                    { time: "18.40–19.00", content: "Kombinera avancerade trick med positioner" },
                    { time: "19.00–19.20", content: "Teori: Bygga ett sammanhängande program" },
                    { time: "19.20–19.30", content: "Avslutning och feedback" }
                ],
                notes: ""
            },
            3: {
                title: "Tillfälle 3: Förfining och detaljer",
                schedule: [
                    { time: "18.00–18.10", content: "Uppvärmning och repetition av föregående moment" },
                    { time: "18.10–18.40", content: "Förfining av rörelser och tajming" },
                    { time: "18.40–19.00", content: "Lägga till små detaljer i trick och övergångar" },
                    { time: "19.00–19.20", content: "Teori: Viktiga detaljer för flyt och precision" },
                    { time: "19.20–19.30", content: "Avslutning och hemläxa" }
                ],
                notes: ""
            },
            4: {
                title: "Tillfälle 4: Programkörning och analys",
                schedule: [
                    { time: "18.00–18.10", content: "Repetition av tidigare moment" },
                    { time: "18.10–18.40", content: "Körning av programdelar och analys" },
                    { time: "18.40–19.00", content: "Feedback på individuella program" },
                    { time: "19.00–19.20", content: "Teori: Förbättring genom feedback och analys" },
                    { time: "19.20–19.30", content: "Avslutning och förberedelse inför uppvisning" }
                ],
                notes: ""
            },
            5: {
                title: "Tillfälle 5: Uppvisning och avslutning",
                schedule: [
                    { time: "18.00–18.10", content: "Uppvärmning och förberedelse" },
                    { time: "18.10–19.00", content: "Uppvisning av individuella program" },
                    { time: "19.00–19.20", content: "Reflektion och feedback på programmen" },
                    { time: "19.20–19.30", content: "Avslutning och gruppfoto" }
                ],
                notes: ""
            }
        };

        // Läs och visa data
        const sessions = JSON.parse(localStorage.getItem('sessions')) || JSON.parse(JSON.stringify(defaultSessions));

        function saveToLocalStorage() {
            localStorage.setItem('sessions', JSON.stringify(sessions));
        }

        function showSession(sessionId) {
            const session = sessions[sessionId];
            document.getElementById("session-title").innerText = session.title;
            document.getElementById("session-notes").value = session.notes || "";
            updateSchedule(sessionId);
            document.getElementById("session-details").dataset.currentSessionId = sessionId;
            document.getElementById("session-details").style.display = "block";
        }

        function updateSchedule(sessionId) {
            const scheduleList = document.getElementById("schedule-list");
            scheduleList.innerHTML = "";
            sessions[sessionId].schedule.forEach((item, index) => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <strong>${item.time}</strong>
                    <textarea 
                        class="content" 
                        onchange="updateContent(${sessionId}, ${index}, this.value)"
                    >${item.content}</textarea>
                `;
                scheduleList.appendChild(li);
            });
        }

        function updateContent(sessionId, index, value) {
            sessions[sessionId].schedule[index].content = value;
            saveToLocalStorage();
        }

        function saveSession() {
            const sessionId = document.getElementById("session-details").dataset.currentSessionId;
            const updatedNotes = document.getElementById("session-notes").value;
            sessions[sessionId].notes = updatedNotes;
            saveToLocalStorage();
            alert("Ändringar sparade!");
        }

        function resetToDefault() {
            if (confirm("Vill du verkligen återställa alla tillfällen till grundinställningarna?")) {
                Object.keys(defaultSessions).forEach(sessionId => {
                    sessions[sessionId] = JSON.parse(JSON.stringify(defaultSessions[sessionId]));
                });
                saveToLocalStorage();
                alert("Alla tillfällen har återställts till grund.");
                location.reload();
            }
        }

        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            let y = 10;

            doc.setFontSize(16);
            doc.text("Sammanfattning: Avancerad Kurs", 10, y);
            y += 10;

            for (const [sessionId, session] of Object.entries(sessions)) {
                doc.setFontSize(14);
                doc.text(`${session.title}`, 10, y);
                y += 8;

                session.schedule.forEach(item => {
                    doc.setFontSize(12);
                    doc.text(`${item.time}: ${item.content}`, 10, y);
                    y += 6;
                });

                if (session.notes) {
                    doc.setFontSize(12);
                    doc.text(`Anteckningar: ${session.notes}`, 10, y);
                    y += 10;
                } else {
                    y += 5;
                }
            }

            doc.save("Avancerad-Kurs-Sammanfattning.pdf");
        }
    </script>
</body>
</html>
