<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avancerad kurs</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .back-button {
            background: #cccccc;
            color: #333;
            border: none;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            cursor: pointer;
            font-size: 0.95rem;
            width: 100%;
            max-width: 150px;
            text-align: center;
        }

        .back-button:hover {
            background: #aaaaaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tillbaka-knapp -->
        <button class="back-button" onclick="goBack()">← Tillbaka</button>

        <h1>Avancerad kurs</h1>
        <p>Klicka på ett tillfälle för att se och justera innehållet:</p>

        <div class="course-links">
            <a href="#session1" onclick="showSession(1)">Tillfälle 1</a>
            <a href="#session2" onclick="showSession(2)">Tillfälle 2</a>
            <a href="#session3" onclick="showSession(3)">Tillfälle 3</a>
            <a href="#session4" onclick="showSession(4)">Tillfälle 4</a>
            <a href="#session5" onclick="showSession(5)">Tillfälle 5</a>
        </div>

        <div id="session-details" class="session-details" style="display: none;">
            <h2 id="session-title"></h2>
            <h3>Tidsplan</h3>
            <ul id="schedule-list"></ul>
            <h3>Anteckningar:</h3>
            <textarea id="session-notes" rows="5" placeholder="Lägg till anteckningar här..."></textarea>
            <button onclick="saveSession()">Spara ändringar</button>
        </div>
    </div>

    <script>
        // Tillbaka-knapp funktion
        function goBack() {
            window.history.back();
        }

        // Data för tillfällen
        const sessions = {
            1: {
                title: "Tillfälle 1: Avancerade positioner och precision",
                schedule: [
                    { time: "18.00–18.10", content: "Introduktion och repetition av tidigare nivåer" },
                    { time: "18.10–18.40", content: "Avancerade positioner: Mellan, bakom i rörelse" },
                    { time: "18.40–19.00", content: "Trick: Backa i olika mönster" },
                    { time: "19.00–19.20", content: "Teori: Timing och övergångar" },
                    { time: "19.20–19.30", content: "Avslutning och hemläxa" }
                ],
                notes: ""
            },
            2: {
                title: "Tillfälle 2: Programuppbyggnad och övergångar",
                schedule: [
                    { time: "18.00–18.10", content: "Repetition av avancerade positioner" },
                    { time: "18.10–18.40", content: "Övergångar mellan avancerade positioner" },
                    { time: "18.40–19.00", content: "Kombinera avancerade trick" },
                    { time: "19.00–19.20", content: "Teori: Sammanhängande program" },
                    { time: "19.20–19.30", content: "Avslutning och feedback" }
                ],
                notes: ""
            },
            3: {
                title: "Tillfälle 3: Förfining och detaljer",
                schedule: [
                    { time: "18.00–18.10", content: "Uppvärmning och repetition" },
                    { time: "18.10–18.40", content: "Förfining av rörelser och tajming" },
                    { time: "18.40–19.00", content: "Lägga till detaljer i trick" },
                    { time: "19.00–19.20", content: "Teori: Flyt och precision" },
                    { time: "19.20–19.30", content: "Avslutning och hemläxa" }
                ],
                notes: ""
            },
            4: {
                title: "Tillfälle 4: Programkörning och analys",
                schedule: [
                    { time: "18.00–18.10", content: "Repetition av tidigare moment" },
                    { time: "18.10–18.40", content: "Körning av programdelar" },
                    { time: "18.40–19.00", content: "Feedback på program" },
                    { time: "19.00–19.20", content: "Teori: Förbättring via analys" },
                    { time: "19.20–19.30", content: "Avslutning och förberedelse" }
                ],
                notes: ""
            },
            5: {
                title: "Tillfälle 5: Uppvisning och avslutning",
                schedule: [
                    { time: "18.00–18.10", content: "Uppvärmning och förberedelse" },
                    { time: "18.10–19.00", content: "Uppvisning av program" },
                    { time: "19.00–19.20", content: "Reflektion och feedback" },
                    { time: "19.20–19.30", content: "Avslutning och gruppfoto" }
                ],
                notes: ""
            }
        };

        // Visa tillfälle
        function showSession(sessionId) {
            const session = sessions[sessionId];
            document.getElementById("session-title").innerText = session.title;

            const scheduleList = document.getElementById("schedule-list");
            scheduleList.innerHTML = "";
            session.schedule.forEach(item => {
                const li = document.createElement("li");
                li.innerHTML = `<strong>${item.time}</strong>: ${item.content}`;
                scheduleList.appendChild(li);
            });

            const notes = document.getElementById("session-notes");
            notes.value = session.notes;

            document.getElementById("session-details").style.display = "block";
        }

        // Spara anteckningar
        function saveSession() {
            const sessionId = Object.keys(sessions).find(
                key => sessions[key].title === document.getElementById("session-title").innerText
            );
            sessions[sessionId].notes = document.getElementById("session-notes").value;
            alert("Ändringar sparade!");
        }
    </script>
</body>
</html>
