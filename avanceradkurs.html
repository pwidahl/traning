<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avancerad kurs</title>
    <link rel="stylesheet" href="styles.css">
    <style>
    /* Mobiloptimering av boxarna */
    ul li {
        background: #fff;
        margin-bottom: 10px;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 100%;
        box-sizing: border-box; /* Förhindra att boxarna går utanför ramen */
    }

    ul li strong {
        font-size: 0.9rem;
        color: #333;
        display: block; /* För att säkerställa att tiden visas tydligt */
    }

    textarea {
        width: 100%;
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 10px;
        font-size: 0.9rem;
        resize: vertical;
        box-sizing: border-box; /* Säkerställ att textarea hålls inom ramarna */
    }

    /* Responsiv design */
    @media (max-width: 768px) {
        ul li {
            padding: 10px;
            gap: 8px;
        }

        textarea {
            font-size: 0.85rem;
        }
    }

    @media (max-width: 480px) {
        ul li {
            padding: 8px;
            gap: 6px;
        }

        textarea {
            font-size: 0.8rem;
        }
    }
        /* Grundlayout */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f9f4ef;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 15px;
        }

        h1, h2, h3 {
            text-align: center;
            color: #333;
        }

        p {
            text-align: center;
            color: #666;
            font-size: 0.95rem;
        }

        /* Kurslänkar */
        .course-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .course-links a {
            display: block;
            text-align: center;
            background: #6a11cb;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .course-links a:hover {
            background: #2575fc;
        }

        /* Sessiondetaljer */
        .session-details {
            margin-top: 20px;
        }

        ul {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        ul li {
            background: #fff;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        ul li strong {
            font-size: 0.9rem;
            color: #333;
        }

        textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            font-size: 0.9rem;
            resize: vertical;
        }

        button {
            font-size: 0.95rem;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }

        .save-button {
            background: #2575fc;
            color: white;
        }

        .save-button:hover {
            background: #1b4d9c;
        }

        .reset-button {
            background: #e63946;
            color: white;
            margin-top: 20px;
        }

        .reset-button:hover {
            background: #d62828;
        }

        /* Mobiloptimering */
        @media (max-width: 768px) {
            .course-links a {
                font-size: 0.85rem;
                padding: 8px;
            }

            ul li {
                padding: 10px;
                gap: 8px;
            }

            textarea {
                font-size: 0.85rem;
            }

            button {
                font-size: 0.9rem;
                padding: 8px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            p {
                font-size: 0.85rem;
            }

            .course-links a {
                font-size: 0.8rem;
                padding: 7px;
            }

            ul li {
                padding: 8px;
                gap: 6px;
            }

            textarea {
                font-size: 0.8rem;
            }

            button {
                font-size: 0.85rem;
                padding: 7px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Avancerad kurs</h1>
        <p>Klicka på ett tillfälle för att se och justera innehållet:</p>
        
        <div class="course-links">
            <a href="#session1" onclick="showSession(1)">Tillfälle 1</a>
            <a href="#session2" onclick="showSession(2)">Tillfälle 2</a>
            <a href="#session3" onclick="showSession(3)">Tillfälle 3</a>
            <a href="#session4" onclick="showSession(4)">Tillfälle 4</a>
            <a href="#session5" onclick="showSession(5)">Tillfälle 5</a>
        </div>
        
        <div id="session-details" class="session-details" style="display: none;">
            <h2 id="session-title"></h2>
            <h3>Tidsplan</h3>
            <ul id="schedule-list"></ul>
            <h3>Anteckningar:</h3>
            <textarea id="session-notes" rows="5" placeholder="Lägg till anteckningar här..."></textarea>
            <button class="save-button" onclick="saveSession()">Spara ändringar</button>
        </div>

        <button class="reset-button" onclick="resetToDefault()">Återställ till grund</button>
    </div>
    
    <footer>
        <p style="text-align: center; margin-top: 20px;">&copy; 2025 Kursadministration</p>
    </footer>

    <script>
        const defaultSessions = {
            1: {
                title: "Tillfälle 1: Introduktion och grunder",
                schedule: [
                    { time: "18.00–18.10", content: "Introduktion" },
                    { time: "18.10–18.40", content: "Grundpositioner (Front, höger sida)" },
                    { time: "18.40–19.00", content: "Trick: Snurra höger/vänster" },
                    { time: "19.00–19.20", content: "Teori: Shaping och belöningsplacering" },
                    { time: "19.20–19.30", content: "Avslutning och hemläxa" }
                ],
                notes: ""
            }
        };

        const sessions = JSON.parse(localStorage.getItem('sessions')) || JSON.parse(JSON.stringify(defaultSessions));

        function saveToLocalStorage() {
            localStorage.setItem('sessions', JSON.stringify(sessions));
        }

        function showSession(sessionId) {
            const session = sessions[sessionId];
            document.getElementById("session-title").innerText = session.title;
            document.getElementById("session-notes").value = session.notes || "";
            updateSchedule(sessionId);
            document.getElementById("session-details").style.display = "block";
        }

        function updateSchedule(sessionId) {
            const scheduleList = document.getElementById("schedule-list");
            scheduleList.innerHTML = "";
            sessions[sessionId].schedule.forEach((item, index) => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <strong>${item.time}</strong>
                    <textarea 
                        class="content" 
                        onchange="updateContent(${sessionId}, ${index}, this.value)"
                    >${item.content}</textarea>
                `;
                scheduleList.appendChild(li);
            });
        }

        function updateContent(sessionId, index, value) {
            sessions[sessionId].schedule[index].content = value;
            saveToLocalStorage();
        }

        function saveSession() {
            const sessionId = document.getElementById("session-details").dataset.currentSessionId;
            const updatedNotes = document.getElementById("session-notes").value;
            sessions[sessionId].notes = updatedNotes;
            saveToLocalStorage();
            alert("Ändringar sparade!");
        }

        function resetToDefault() {
            if (confirm("Vill du verkligen återställa alla tillfällen till grundinställningarna?")) {
                Object.keys(defaultSessions).forEach(sessionId => {
                    sessions[sessionId] = JSON.parse(JSON.stringify(defaultSessions[sessionId]));
                });
                saveToLocalStorage();
                alert("Alla tillfällen har återställts till grund.");
                location.reload();
            }
        }
    </script>
</body>
</html>
