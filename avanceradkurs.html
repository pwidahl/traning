<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avancerad kurs</title>
    <style>
        .button {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
            margin: 10px 0;
        }

        .back-button {
            background: #e0e0e0;
            color: #333;
            border: 1px solid #bdbdbd;
            transition: all 0.3s;
        }

        .back-button:hover {
            background: #bdbdbd;
            color: #000;
        }

        .save-button {
            background: #28a745;
            color: white;
            border: none;
        }

        .save-button:hover {
            background: #218838;
        }

        .reset-button {
            background: #dc3545;
            color: white;
            border: none;
        }

        .reset-button:hover {
            background: #c82333;
        }

        textarea {
            width: 100%;
            margin-top: 5px;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        ul {
            list-style: none; /* Tar bort punkterna */
            padding: 0; /* Tar bort standard inriktning */
            margin: 0; /* Tar bort standard marginaler */
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tillbaka-knapp -->
        <a href="javascript:history.back()" class="button back-button">← Tillbaka</a>

        <h1>Avancerad kurs</h1>
        <p>Klicka på ett tillfälle för att redigera innehållet:</p>

        <div class="course-links">
            <a href="#session1" onclick="showSession(1)">Tillfälle 1</a>
            <a href="#session2" onclick="showSession(2)">Tillfälle 2</a>
            <a href="#session3" onclick="showSession(3)">Tillfälle 3</a>
            <a href="#session4" onclick="showSession(4)">Tillfälle 4</a>
            <a href="#session5" onclick="showSession(5)">Tillfälle 5</a>
        </div>

        <div id="session-details" class="session-details" style="display: none;">
            <h2 id="session-title"></h2>
            <h3>Tidsplan</h3>
            <ul id="schedule-list"></ul>
            <h3>Anteckningar:</h3>
            <textarea id="session-notes" rows="5" placeholder="Lägg till anteckningar här..."></textarea>
            <button class="button save-button" onclick="saveSession()">Spara ändringar</button>
            <button class="button reset-button" onclick="resetSession()">Återställ till ursprung</button>
        </div>
    </div>

    <script>
        const defaultSessions = {
            // Data för tillfällen
        };

        let sessions = JSON.parse(JSON.stringify(defaultSessions));

        function getSessionIdByTitle() {
            return Object.keys(sessions).find(
                key => sessions[key].title === document.getElementById("session-title").innerText
            );
        }

        function showSession(sessionId, reset = false) {
            if (reset) sessions[sessionId] = JSON.parse(JSON.stringify(defaultSessions[sessionId]));
            const session = sessions[sessionId];
            document.getElementById("session-title").innerText = session.title;

            const scheduleList = document.getElementById("schedule-list");
            scheduleList.innerHTML = session.schedule
                .map((item, index) =>
                    `<li>
                        <strong>${item.time}</strong>
                        <textarea onchange="updateContent(${sessionId}, ${index}, this.value)">${item.content}</textarea>
                    </li>`
                )
                .join("");

            document.getElementById("session-notes").value = session.notes;
            document.getElementById("session-details").style.display = "block";
        }

        function updateContent(sessionId, index, value) {
            sessions[sessionId].schedule[index].content = value;
        }

        function saveSession() {
            const sessionId = getSessionIdByTitle();
            sessions[sessionId].notes = document.getElementById("session-notes").value;
            alert("Ändringar sparade!");
        }

        function resetSession() {
            if (confirm("Vill du verkligen återställa till ursprungligt innehåll?")) {
                const sessionId = getSessionIdByTitle();
                showSession(sessionId, true);
                alert("Tillfället har återställts till ursprungligt innehåll.");
            }
        }
    </script>
</body>
</html>
