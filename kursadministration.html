<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kursadministration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f9f9f9;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background: #f4f4f4;
        }

        .delete-button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #c82333;
        }

        .notes-section {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kursadministration</h1>
        <label for="course-name">Kursnamn:</label>
        <input type="text" id="course-name" placeholder="Ange kursnamn">
        <button id="create-course">Skapa Kurs</button>

        <label for="course-select">Välj Kurs:</label>
        <select id="course-select">
            <option value="">-- Välj Kurs --</option>
        </select>

        <label for="owner-name">Ägare:</label>
        <input type="text" id="owner-name" placeholder="Ange ägarens namn">

        <label for="dog-name">Hund:</label>
        <input type="text" id="dog-name" placeholder="Ange hundens namn">

        <button id="add-participant">Lägg till deltagare</button>

        <h2>Deltagare</h2>
        <table>
            <thead>
                <tr>
                    <th>Ägare</th>
                    <th>Hund</th>
                    <th>Åtgärder</th>
                </tr>
            </thead>
            <tbody id="participants-list"></tbody>
        </table>
    </div>

    <script>
        // Variabler för kursdata
        let courses = JSON.parse(localStorage.getItem('courses')) || {};

        // Initiera sidan
        function init() {
            console.log('Initiera...');
            renderCourses();
        }

        // Spara till localStorage
        function saveToLocalStorage() {
            console.log('Sparar data till localStorage...');
            localStorage.setItem('courses', JSON.stringify(courses));
        }

        // Rendera kurslistan
        function renderCourses() {
            console.log('Renderar kurser...');
            const courseSelect = document.getElementById('course-select');
            courseSelect.innerHTML = '<option value="">-- Välj Kurs --</option>';
            Object.keys(courses).forEach(courseName => {
                const option = document.createElement('option');
                option.value = courseName;
                option.textContent = courseName;
                courseSelect.appendChild(option);
            });
        }

        // Lägg till kurs
        document.getElementById('create-course').addEventListener('click', () => {
            const courseName = document.getElementById('course-name').value.trim();
            if (!courseName) {
                alert('Kursnamn kan inte vara tomt!');
                return;
            }
            if (courses[courseName]) {
                alert('Denna kurs finns redan!');
                return;
            }
            courses[courseName] = [];
            saveToLocalStorage();
            renderCourses();
            document.getElementById('course-name').value = '';
            alert(`Kurs "${courseName}" skapad!`);
        });

        // Lägg till deltagare
        document.getElementById('add-participant').addEventListener('click', () => {
            const courseName = document.getElementById('course-select').value;
            const ownerName = document.getElementById('owner-name').value.trim();
            const dogName = document.getElementById('dog-name').value.trim();

            if (!courseName) {
                alert('Välj en kurs!');
                return;
            }
            if (!ownerName || !dogName) {
                alert('Både ägarens och hundens namn måste anges!');
                return;
            }

            courses[courseName].push({ owner: ownerName, dog: dogName });
            saveToLocalStorage();
            renderParticipants(courseName);
            document.getElementById('owner-name').value = '';
            document.getElementById('dog-name').value = '';
        });

        // Rendera deltagare
        function renderParticipants(courseName) {
            console.log(`Renderar deltagare för kurs: ${courseName}`);
            const participantsList = document.getElementById('participants-list');
            participantsList.innerHTML = '';
            courses[courseName].forEach((participant, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${participant.owner}</td>
                    <td>${participant.dog}</td>
                    <td><button class="delete-button" onclick="deleteParticipant('${courseName}', ${index})">Ta bort</button></td>
                `;
                participantsList.appendChild(row);
            });
        }

        // Ta bort deltagare
        function deleteParticipant(courseName, index) {
            console.log(`Tar bort deltagare från kurs: ${courseName}, index: ${index}`);
            courses[courseName].splice(index, 1);
            saveToLocalStorage();
            renderParticipants(courseName);
        }

        // Lyssna på kursval
        document.getElementById('course-select').addEventListener('change', (e) => {
            const selectedCourse = e.target.value;
            if (selectedCourse) {
                renderParticipants(selectedCourse);
            } else {
                document.getElementById('participants-list').innerHTML = '';
            }
        });

        // Initiera vid sidladdning
        init();
    </script>
</body>
</html>
