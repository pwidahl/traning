<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kursadministration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f9f9f9;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        button {
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background: #f4f4f4;
        }

        .delete-button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kursadministration</h1>

        <!-- Skapa kurs -->
        <label for="course-name">Kursnamn:</label>
        <input type="text" id="course-name" placeholder="Ange kursens namn">
        <button onclick="addCourse()">Skapa Kurs</button>

        <!-- Välj kurs -->
        <label for="course-select">Välj Kurs:</label>
        <select id="course-select" onchange="renderParticipants()">
            <option value="">-- Välj Kurs --</option>
        </select>

        <!-- Lägg till deltagare -->
        <label for="owner-name">Ägarens namn:</label>
        <input type="text" id="owner-name" placeholder="Ange ägarens namn">
        <label for="dog-name">Hundens namn:</label>
        <input type="text" id="dog-name" placeholder="Ange hundens namn">
        <button onclick="addParticipant()">Lägg till deltagare</button>

        <!-- Visa deltagare -->
        <h2>Deltagare</h2>
        <table>
            <thead>
                <tr>
                    <th>Ägare</th>
                    <th>Hund</th>
                    <th>Ta bort</th>
                </tr>
            </thead>
            <tbody id="participant-table"></tbody>
        </table>
    </div>

    <script>
        // Hämta data från localStorage eller initiera tomma objekt
        let courses = JSON.parse(localStorage.getItem("courses")) || {};

        // Spara data till localStorage
        function saveToLocalStorage() {
            console.log("Sparar data till localStorage...");
            localStorage.setItem("courses", JSON.stringify(courses));
        }

        // Lägg till en ny kurs
        function addCourse() {
            const courseName = document.getElementById("course-name").value.trim();
            if (!courseName) {
                alert("Ange ett kursnamn!");
                return;
            }
            if (courses[courseName]) {
                alert("Kursen finns redan!");
                return;
            }
            courses[courseName] = [];
            saveToLocalStorage();
            renderCourses();
            document.getElementById("course-name").value = "";
            alert(`Kurs "${courseName}" skapades!`);
        }

        // Rendera alla kurser i dropdown-menyn
        function renderCourses() {
            const courseSelect = document.getElementById("course-select");
            courseSelect.innerHTML = '<option value="">-- Välj Kurs --</option>';
            Object.keys(courses).forEach(courseName => {
                const option = document.createElement("option");
                option.value = courseName;
                option.textContent = courseName;
                courseSelect.appendChild(option);
            });
        }

        // Lägg till en ny deltagare
        function addParticipant() {
            const courseName = document.getElementById("course-select").value;
            const ownerName = document.getElementById("owner-name").value.trim();
            const dogName = document.getElementById("dog-name").value.trim();

            if (!courseName) {
                alert("Välj en kurs!");
                return;
            }
            if (!ownerName || !dogName) {
                alert("Ange både ägarens och hundens namn!");
                return;
            }

            courses[courseName].push({ owner: ownerName, dog: dogName });
            saveToLocalStorage();
            renderParticipants();
            document.getElementById("owner-name").value = "";
            document.getElementById("dog-name").value = "";
        }

        // Rendera deltagarlistan för vald kurs
        function renderParticipants() {
            const courseName = document.getElementById("course-select").value;
            const participantTable = document.getElementById("participant-table");
            participantTable.innerHTML = "";

            if (!courseName) return;

            courses[courseName].forEach((participant, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${participant.owner}</td>
                    <td>${participant.dog}</td>
                    <td><button class="delete-button" onclick="deleteParticipant('${courseName}', ${index})">Ta bort</button></td>
                `;
                participantTable.appendChild(row);
            });
        }

        // Ta bort en deltagare
        function deleteParticipant(courseName, index) {
            courses[courseName].splice(index, 1);
            saveToLocalStorage();
            renderParticipants();
        }

        // Initiera sidan
        function init() {
            console.log("Initierar sidan...");
            renderCourses();
        }

        init();
    </script>
</body>
</html>
