<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kursadministration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
            max-width: 800px;
            margin: auto;
            background: #f9f9f9;
            color: #333;
        }

        h1, h2 {
            text-align: center;
            color: #444;
        }

        .container {
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        button {
            background: #28a745;
            color: white;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #218838;
        }

        .delete-button {
            background: #dc3545;
            color: white;
            margin-top: 10px;
        }

        .delete-button:hover {
            background: #c82333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border: 1px solid #ddd;
        }

        th {
            background: #f4f4f4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kursadministration</h1>
        <div class="form-group">
            <label for="course-select">Välj kurs:</label>
            <select id="course-select">
                <option value="Nybörjarkurs">Nybörjarkurs</option>
                <option value="Fortsättningskurs">Fortsättningskurs</option>
                <option value="Avancerad kurs">Avancerad kurs</option>
            </select>
        </div>

        <div class="form-group">
            <label for="participant-name">Deltagarens namn:</label>
            <input type="text" id="participant-name" placeholder="Ange deltagarens namn">
        </div>

        <button onclick="addParticipant()">Lägg till deltagare</button>

        <h2>Deltagare</h2>
        <table id="participant-table">
            <thead>
                <tr>
                    <th>Namn</th>
                    <th>Kurs</th>
                    <th>Åtgärd</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dynamiskt innehåll -->
            </tbody>
        </table>
    </div>

    <script>
        const participants = JSON.parse(localStorage.getItem('participants')) || [];

        function renderTable() {
            const tableBody = document.getElementById('participant-table').querySelector('tbody');
            tableBody.innerHTML = '';

            participants.forEach((participant, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${participant.name}</td>
                    <td>${participant.course}</td>
                    <td>
                        <button class="delete-button" onclick="deleteParticipant(${index})">Ta bort</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function addParticipant() {
            const nameInput = document.getElementById('participant-name');
            const courseSelect = document.getElementById('course-select');
            const name = nameInput.value.trim();
            const course = courseSelect.value;

            if (!name) {
                alert('Ange deltagarens namn.');
                return;
            }

            participants.push({ name, course });
            localStorage.setItem('participants', JSON.stringify(participants));
            nameInput.value = '';
            renderTable();
        }

        function deleteParticipant(index) {
            participants.splice(index, 1);
            localStorage.setItem('participants', JSON.stringify(participants));
            renderTable();
        }

        // Initiera tabellen vid sidladdning
        renderTable();
    </script>
</body>
</html>
