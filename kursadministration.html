<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kursadministration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f9f9f9;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        button {
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f4f4f4;
        }

        .message {
            text-align: center;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kursadministration</h1>

        <!-- Lägg till kurs -->
        <label for="course-name">Skapa ny kurs:</label>
        <input type="text" id="course-name" placeholder="Ange kursnamn">
        <button onclick="addCourse()">Lägg till kurs</button>

        <!-- Välj kurs -->
        <label for="course-select">Välj kurs:</label>
        <select id="course-select" onchange="renderParticipants()">
            <option value="">-- Välj en kurs --</option>
        </select>

        <!-- Lägg till deltagare -->
        <label for="participant-name">Deltagares namn:</label>
        <input type="text" id="participant-name" placeholder="Ange deltagares namn">
        <button onclick="addParticipant()">Lägg till deltagare</button>

        <!-- Visa deltagare -->
        <h2>Deltagare</h2>
        <div id="participant-container">
            <table>
                <thead>
                    <tr>
                        <th>Deltagare</th>
                        <th>Åtgärder</th>
                    </tr>
                </thead>
                <tbody id="participant-table"></tbody>
            </table>
            <p id="no-participants" class="message" style="display: none;">Inga deltagare i denna kurs.</p>
        </div>
    </div>

    <script>
        // Lagra kurser och deltagare
        let courses = {};

        // Lägg till en ny kurs
        function addCourse() {
            const courseName = document.getElementById("course-name").value.trim();

            if (!courseName) {
                alert("Ange ett kursnamn!");
                return;
            }

            if (courses[courseName]) {
                alert("Kursen finns redan!");
                return;
            }

            courses[courseName] = [];
            document.getElementById("course-name").value = "";
            renderCourses();
            alert(`Kurs "${courseName}" har skapats!`);
        }

        // Rendera alla kurser i dropdown
        function renderCourses() {
            const courseSelect = document.getElementById("course-select");
            courseSelect.innerHTML = '<option value="">-- Välj en kurs --</option>';
            Object.keys(courses).forEach(courseName => {
                const option = document.createElement("option");
                option.value = courseName;
                option.textContent = courseName;
                courseSelect.appendChild(option);
            });
        }

        // Lägg till en ny deltagare
        function addParticipant() {
            const courseName = document.getElementById("course-select").value;
            const participantName = document.getElementById("participant-name").value.trim();

            if (!courseName) {
                alert("Välj en kurs!");
                return;
            }

            if (!participantName) {
                alert("Ange deltagares namn!");
                return;
            }

            courses[courseName].push(participantName);
            document.getElementById("participant-name").value = "";
            renderParticipants();
            alert(`Deltagaren "${participantName}" har lagts till i kursen "${courseName}"!`);
        }

        // Rendera deltagare för vald kurs
        function renderParticipants() {
            const courseName = document.getElementById("course-select").value;
            const participantTable = document.getElementById("participant-table");
            const noParticipantsMessage = document.getElementById("no-participants");

            participantTable.innerHTML = "";

            if (!courseName || !courses[courseName] || courses[courseName].length === 0) {
                noParticipantsMessage.style.display = "block";
                return;
            }

            noParticipantsMessage.style.display = "none";

            courses[courseName].forEach((participant, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${participant}</td>
                    <td><button onclick="deleteParticipant('${courseName}', ${index})">Ta bort</button></td>
                `;
                participantTable.appendChild(row);
            });
        }

        // Ta bort en deltagare
        function deleteParticipant(courseName, index) {
            courses[courseName].splice(index, 1);
            renderParticipants();
        }

        // Initiera sidan
        function init() {
            renderCourses();
        }

        init();
    </script>
</body>
</html>
