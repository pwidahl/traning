<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kursadministration</title>
    <style>
        /* Grundläggande layout */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f9f9f9;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }

        input, select, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        button {
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border: 1px solid #ddd;
        }

        th {
            background: #f4f4f4;
        }

        .delete-button {
            background: #dc3545;
            color: white;
            border: none;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #c82333;
        }

        .notes-container {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .edit-button {
            background: #ffc107;
            color: white;
        }

        .edit-button:hover {
            background: #e0a800;
        }

        .save-button {
            background: #28a745;
            color: white;
        }

        .save-button:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kursadministration</h1>

        <label for="course-name">Kursnamn:</label>
        <input type="text" id="course-name" placeholder="Ange kursens namn">
        <button onclick="addCourse()">Skapa kurs</button>

        <label for="course-select">Välj kurs:</label>
        <select id="course-select">
            <option value="">-- Välj en kurs --</option>
        </select>

        <label for="owner-name">Ägarens namn:</label>
        <input type="text" id="owner-name" placeholder="Ange ägarens namn">

        <label for="dog-name">Hundens namn:</label>
        <input type="text" id="dog-name" placeholder="Ange hundens namn">

        <button onclick="addParticipant()">Lägg till deltagare</button>

        <h2>Deltagare</h2>
        <table id="participant-table">
            <thead>
                <tr>
                    <th>Ägare</th>
                    <th>Hund</th>
                    <th>Anteckningar</th>
                    <th>Åtgärder</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dynamiska deltagare -->
            </tbody>
        </table>

        <div id="notes-section" class="notes-container" style="display: none;">
            <h2>Anteckningar för <span id="notes-participant"></span></h2>
            <ul id="notes-list">
                <!-- Dynamiska anteckningar -->
            </ul>
            <textarea id="new-note" rows="3" placeholder="Lägg till en ny anteckning"></textarea>
            <button onclick="addNote()">Lägg till anteckning</button>
        </div>
    </div>

    <script>
        let courses = JSON.parse(localStorage.getItem('courses')) || {};
        let participants = JSON.parse(localStorage.getItem('participants')) || {};

        let selectedCourse = "";
        let selectedParticipantIndex = null;

        function saveToLocalStorage() {
            localStorage.setItem('courses', JSON.stringify(courses));
            localStorage.setItem('participants', JSON.stringify(participants));
        }

        function addCourse() {
            const courseName = document.getElementById('course-name').value.trim();
            if (!courseName) {
                alert("Ange ett kursnamn!");
                return;
            }

            if (!courses[courseName]) {
                courses[courseName] = [];
                saveToLocalStorage();
                renderCourses();
                alert(`Kurs "${courseName}" skapades!`);
            } else {
                alert("Kursen finns redan!");
            }
            document.getElementById('course-name').value = '';
        }

        function renderCourses() {
            const courseSelect = document.getElementById('course-select');
            courseSelect.innerHTML = '<option value="">-- Välj en kurs --</option>';
            Object.keys(courses).forEach(course => {
                const option = document.createElement('option');
                option.value = course;
                option.textContent = course;
                courseSelect.appendChild(option);
            });
        }

        function addParticipant() {
            selectedCourse = document.getElementById('course-select').value;
            const ownerName = document.getElementById('owner-name').value.trim();
            const dogName = document.getElementById('dog-name').value.trim();

            if (!selectedCourse) {
                alert("Välj en kurs!");
                return;
            }
            if (!ownerName || !dogName) {
                alert("Ange både ägarens och hundens namn!");
                return;
            }

            participants[selectedCourse] = participants[selectedCourse] || [];
            participants[selectedCourse].push({ owner: ownerName, dog: dogName, notes: [] });
            saveToLocalStorage();
            renderParticipants();

            document.getElementById('owner-name').value = '';
            document.getElementById('dog-name').value = '';
        }

        function renderParticipants() {
            const tableBody = document.getElementById('participant-table').querySelector('tbody');
            tableBody.innerHTML = '';

            selectedCourse = document.getElementById('course-select').value;
            const selectedParticipants = participants[selectedCourse] || [];

            selectedParticipants.forEach((participant, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${participant.owner}</td>
                    <td>${participant.dog}</td>
                    <td>${participant.notes.length} anteckningar</td>
                    <td>
                        <button onclick="viewNotes(${index})">Visa anteckningar</button>
                        <button class="delete-button" onclick="deleteParticipant(${index})">Ta bort</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function viewNotes(index) {
            selectedParticipantIndex = index;
            const participant = participants[selectedCourse][index];

            document.getElementById('notes-section').style.display = 'block';
            document.getElementById('notes-participant').innerText = `${participant.owner} (${participant.dog})`;

            const notesList = document.getElementById('notes-list');
            notesList.innerHTML = '';

            participant.notes.forEach((note, noteIndex) => {
                const listItem = document.createElement('li');
                listItem.innerHTML = `
                    <textarea onchange="updateNote(${noteIndex}, this.value)">${note.text}</textarea>
                    <small>Skapad: ${note.date}</small>
                `;
                notesList.appendChild(listItem);
            });
        }

        function addNote() {
            const noteText = document.getElementById('new-note').value.trim();
            if (!noteText) {
                alert("Anteckningen kan inte vara tom!");
                return;
            }

            const date = new Date().toLocaleString();
            participants[selectedCourse][selectedParticipantIndex].notes.push({ text: noteText, date });
            saveToLocalStorage();
            viewNotes(selectedParticipantIndex);
            document.getElementById('new-note').value = '';
        }

        function updateNote(noteIndex, newText) {
            participants[selectedCourse][selectedParticipantIndex].notes[noteIndex].text = newText;
            saveToLocalStorage();
        }

        function deleteParticipant(index) {
            participants[selectedCourse].splice(index, 1);
            saveToLocalStorage();
            renderParticipants();
            document.getElementById('notes-section').style.display = 'none';
        }

        document.getElementById('course-select').addEventListener('change', renderParticipants);

        renderCourses();
    </script>
</body>
</html>
