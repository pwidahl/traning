<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kursadministration</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Anpassningar för bättre layout */
        .form-section {
            margin-top: 20px;
            padding: 15px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .form-section h2 {
            margin-bottom: 15px;
            font-size: 1.4rem;
        }

        .form-section form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-section input,
        .form-section textarea,
        .form-section select,
        .form-section button {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .form-section button {
            background: #6a11cb;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-section button:hover {
            background: #2575fc;
        }

        .course-details {
            margin-top: 20px;
            padding: 10px;
            background: #f9f4ef;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .course-details h3 {
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .course-links {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kursadministration</h1>
        <p>Administrera kurser, deltagare och analysera kursinformation.</p>

        <!-- Lägg till ny kurs -->
        <div class="form-section">
            <h2>Lägg till ny kurs</h2>
            <form id="add-course-form">
                <input type="text" id="course-name" placeholder="Kursnamn" required>
                <textarea id="course-description" placeholder="Beskriv kursen"></textarea>
                <label for="course-start-date">Kursstart:</label>
                <input type="date" id="course-start-date" required>
                <label for="course-sessions">Antal tillfällen:</label>
                <input type="number" id="course-sessions" min="1" placeholder="Antal tillfällen" required>
                <button type="submit">Lägg till kurs</button>
            </form>
        </div>

        <!-- Kurser -->
        <div class="course-details">
            <h2>Kurser</h2>
            <ul id="course-list"></ul>
        </div>

        <!-- Hantera deltagare -->
        <div class="form-section">
            <h2>Hantera deltagare</h2>
            <form id="add-participant-form">
                <select id="course-select" required>
                    <option value="">Välj en kurs</option>
                </select>
                <input type="text" id="participant-name" placeholder="Deltagarens namn" required>
                <textarea id="participant-progress" placeholder="Beskriv framsteg"></textarea>
                <button type="submit">Lägg till deltagare</button>
            </form>
        </div>

        <!-- Deltagare per kurs -->
        <div class="course-details">
            <h2>Deltagare per kurs</h2>
            <div id="participant-details"></div>
        </div>

        <!-- Sammanställning -->
        <div class="form-section">
            <h2>Sammanställning</h2>
            <label for="summary-course-select">Välj kurs för sammanställning:</label>
            <select id="summary-course-select">
                <option value="all">Alla kurser</option>
            </select>
            <button onclick="generateSummary()">Generera Sammanställning</button>
            <textarea id="summary-output" rows="10" readonly></textarea>
            <button onclick="exportToPDF()">Exportera som PDF</button>
            <button onclick="exportToWord()">Exportera som Word</button>
        </div>
    </div>

    <footer>
        <a href="index.html">&larr; Tillbaka till startsidan</a>
    </footer>

    <script>
        // JavaScript-funktioner (samma som tidigare)
    </script>
</body>
</html>
