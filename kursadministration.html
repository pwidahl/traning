<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kursadministration</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f9f9f9;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }

        input, select, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        button {
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        .export-button {
            background: #007bff;
        }

        .export-button:hover {
            background: #0056b3;
        }

        .delete-button {
            background: #dc3545;
            color: white;
        }

        .delete-button:hover {
            background: #c82333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border: 1px solid #ddd;
        }

        th {
            background: #f4f4f4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kursadministration</h1>

        <label for="course-name">Kursnamn:</label>
        <input type="text" id="course-name" placeholder="Ange kursens namn">

        <button onclick="addCourse()">Skapa kurs</button>

        <label for="course-select">Välj kurs:</label>
        <select id="course-select">
            <option value="">-- Välj en kurs --</option>
        </select>

        <label for="owner-name">Ägarens namn:</label>
        <input type="text" id="owner-name" placeholder="Ange ägarens namn">

        <label for="dog-name">Hundens namn:</label>
        <input type="text" id="dog-name" placeholder="Ange hundens namn">

        <label for="notes">Anteckningar:</label>
        <textarea id="notes" rows="3" placeholder="Lägg till anteckningar om deltagaren"></textarea>

        <button onclick="addParticipant()">Lägg till deltagare</button>

        <h2>Deltagare</h2>
        <table id="participant-table">
            <thead>
                <tr>
                    <th>Kurs</th>
                    <th>Ägare</th>
                    <th>Hund</th>
                    <th>Anteckningar</th>
                    <th>Ta bort</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dynamiska deltagare -->
            </tbody>
        </table>

        <button class="export-button" onclick="exportToPDF()">Exportera till PDF</button>
    </div>

    <script>
        let courses = JSON.parse(localStorage.getItem('courses')) || {};
        let participants = JSON.parse(localStorage.getItem('participants')) || {};

        function saveToLocalStorage() {
            localStorage.setItem('courses', JSON.stringify(courses));
            localStorage.setItem('participants', JSON.stringify(participants));
        }

        function addCourse() {
            const courseName = document.getElementById('course-name').value.trim();
            if (!courseName) {
                alert("Ange ett kursnamn!");
                return;
            }

            if (!courses[courseName]) {
                courses[courseName] = [];
                saveToLocalStorage();
                renderCourses();
                alert(`Kurs "${courseName}" skapades!`);
            } else {
                alert("Kursen finns redan!");
            }
            document.getElementById('course-name').value = '';
        }

        function renderCourses() {
            const courseSelect = document.getElementById('course-select');
            courseSelect.innerHTML = '<option value="">-- Välj en kurs --</option>';
            Object.keys(courses).forEach(course => {
                const option = document.createElement('option');
                option.value = course;
                option.textContent = course;
                courseSelect.appendChild(option);
            });
        }

        function addParticipant() {
            const selectedCourse = document.getElementById('course-select').value;
            const ownerName = document.getElementById('owner-name').value.trim();
            const dogName = document.getElementById('dog-name').value.trim();
            const notes = document.getElementById('notes').value.trim();

            if (!selectedCourse) {
                alert("Välj en kurs!");
                return;
            }
            if (!ownerName || !dogName) {
                alert("Ange både ägarens och hundens namn!");
                return;
            }

            participants[selectedCourse] = participants[selectedCourse] || [];
            participants[selectedCourse].push({ owner: ownerName, dog: dogName, notes });
            saveToLocalStorage();
            renderParticipants(selectedCourse);

            document.getElementById('owner-name').value = '';
            document.getElementById('dog-name').value = '';
            document.getElementById('notes').value = '';
        }

        function renderParticipants(course) {
            const tableBody = document.getElementById('participant-table').querySelector('tbody');
            tableBody.innerHTML = '';

            const selectedParticipants = participants[course] || [];
            selectedParticipants.forEach((participant, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${course}</td>
                    <td>${participant.owner}</td>
                    <td>${participant.dog}</td>
                    <td>${participant.notes}</td>
                    <td><button class="delete-button" onclick="deleteParticipant('${course}', ${index})">Ta bort</button></td>
                `;
                tableBody.appendChild(row);
            });
        }

        function deleteParticipant(course, index) {
            participants[course].splice(index, 1);
            saveToLocalStorage();
            renderParticipants(course);
        }

        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const selectedCourse = document.getElementById('course-select').value;
            const courseName = selectedCourse;

            doc.text(`Deltagarlista: ${courseName}`, 10, 10);

            if (participants[selectedCourse]) {
                participants[selectedCourse].forEach((participant, index) => {
                    doc.text(
                        `${index + 1}. Ägare: ${participant.owner}, Hund: ${participant.dog}, Anteckningar: ${participant.notes}`,
                        10,
                        20 + index * 10
                    );
                });
            }

            doc.save(`${courseName}.pdf`);
        }

        document.getElementById('course-select').addEventListener('change', function () {
            const selectedCourse = this.value;
            renderParticipants(selectedCourse);
        });

        renderCourses();
    </script>
</body>
</html>
