<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kursadministration</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Anpassningar */
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input, textarea, select, button {
            font-size: 1rem;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            background: #e4dace;
            color: #4a4a4a;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #d8c9b9;
        }

        textarea {
            resize: vertical;
        }

        #summary-output {
            font-family: monospace;
            white-space: pre-wrap;
        }

        /* Responsiv design */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            h1, h2 {
                font-size: 1.5rem;
            }

            input, textarea, select, button {
                font-size: 0.9rem;
                padding: 8px;
            }

            #summary-output {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kursadministration</h1>
        <p>Administrera kurser, deltagare och analysera kursinformation.</p>
        
        <!-- Sektion för att lägga till kurser -->
        <div>
            <h2>Lägg till ny kurs</h2>
            <form id="add-course-form">
                <input type="text" id="course-name" placeholder="Kursnamn" required>
                <textarea id="course-description" placeholder="Beskriv kursen"></textarea>
                <label for="course-start-date">Kursstart:</label>
                <input type="date" id="course-start-date" required>
                <label for="course-sessions">Antal tillfällen:</label>
                <input type="number" id="course-sessions" min="1" placeholder="Antal tillfällen" required>
                <button type="submit">Lägg till kurs</button>
            </form>
        </div>

        <!-- Lista med kurser -->
        <div>
            <h2>Kurser</h2>
            <ul id="course-list"></ul>
        </div>

        <!-- Sektion för att lägga till deltagare -->
        <div>
            <h2>Hantera deltagare</h2>
            <form id="add-participant-form">
                <select id="course-select" required>
                    <option value="">Välj en kurs</option>
                </select>
                <input type="text" id="participant-name" placeholder="Deltagarens namn" required>
                <textarea id="participant-progress" placeholder="Beskriv framsteg"></textarea>
                <button type="submit">Lägg till deltagare</button>
            </form>
        </div>

        <!-- Lista med deltagare -->
        <div>
            <h2>Deltagare per kurs</h2>
            <div id="participant-details"></div>
        </div>

        <!-- Sammanställning och analys -->
        <div>
            <h2>Sammanställning</h2>
            <button onclick="generateSummary()">Generera Sammanställning</button>
            <textarea id="summary-output" rows="10" readonly></textarea>
            <button onclick="exportSummary()">Exportera Sammanställning</button>
        </div>
    </div>
    
    <footer>
        <a href="index.html">&larr; Tillbaka till startsidan</a>
    </footer>

    <script>
        // Data för kurser och deltagare
        const data = {
            courses: {}
        };

        // Lägg till ny kurs
        document.getElementById("add-course-form").addEventListener("submit", function (e) {
            e.preventDefault();
            const courseName = document.getElementById("course-name").value.trim();
            const courseDescription = document.getElementById("course-description").value.trim();
            const courseStartDate = document.getElementById("course-start-date").value;
            const courseSessions = parseInt(document.getElementById("course-sessions").value);

            if (courseName && courseStartDate && courseSessions > 0) {
                if (!data.courses[courseName]) {
                    data.courses[courseName] = {
                        description: courseDescription,
                        startDate: courseStartDate,
                        sessions: courseSessions,
                        participants: []
                    };
                    updateCourseList();
                    updateCourseSelect();
                    document.getElementById("course-name").value = "";
                    document.getElementById("course-description").value = "";
                    document.getElementById("course-start-date").value = "";
                    document.getElementById("course-sessions").value = "";
                } else {
                    alert("Kursen finns redan!");
                }
            }
        });

        // Uppdatera kurslistan
        function updateCourseList() {
            const courseList = document.getElementById("course-list");
            courseList.innerHTML = "";
            for (const courseName in data.courses) {
                const li = document.createElement("li");
                li.textContent = `${courseName} - Start: ${data.courses[courseName].startDate}, Tillfällen: ${data.courses[courseName].sessions}`;
                courseList.appendChild(li);
            }
        }

        // Uppdatera kursväljaren
        function updateCourseSelect() {
            const courseSelect = document.getElementById("course-select");
            courseSelect.innerHTML = '<option value="">Välj en kurs</option>';
            for (const courseName in data.courses) {
                const option = document.createElement("option");
                option.value = courseName;
                option.textContent = courseName;
                courseSelect.appendChild(option);
            }
        }

        // Lägg till deltagare
        document.getElementById("add-participant-form").addEventListener("submit", function (e) {
            e.preventDefault();
            const courseName = document.getElementById("course-select").value;
            const participantName = document.getElementById("participant-name").value.trim();
            const participantProgress = document.getElementById("participant-progress").value.trim();

            if (courseName && participantName) {
                data.courses[courseName].participants.push({
                    name: participantName,
                    progress: participantProgress
                });
                updateParticipantDetails();
                document.getElementById("participant-name").value = "";
                document.getElementById("participant-progress").value = "";
            }
        });

        // Uppdatera deltagarlistan
        function updateParticipantDetails() {
            const participantDetails = document.getElementById("participant-details");
            participantDetails.innerHTML = "";
            for (const courseName in data.courses) {
                const courseDiv = document.createElement("div");
                courseDiv.innerHTML = `<h3>${courseName}</h3>`;
                const ul = document.createElement("ul");
                data.courses[courseName].participants.forEach((participant) => {
                    const li = document.createElement("li");
                    li.textContent = `${participant.name}: ${participant.progress}`;
                    ul.appendChild(li);
                });
                courseDiv.appendChild(ul);
                participantDetails.appendChild(courseDiv);
            }
        }

        // Generera sammanställning
        function generateSummary() {
            const summaryOutput = document.getElementById("summary-output");
            let summaryText = "";

            for (const courseName in data.courses) {
                summaryText += `Kurs: ${courseName}\n`;
                summaryText += `Beskrivning: ${data.courses[courseName].description}\n`;
                summaryText += `Startdatum: ${data.courses[courseName].startDate}\n`;
                summaryText += `Antal tillfällen: ${data.courses[courseName].sessions}\n`;
                summaryText += `Deltagare:\n`;
                data.courses[courseName].participants.forEach((participant) => {
                    summaryText += `  - ${participant.name}: ${participant.progress}\n`;
                });
                summaryText += `\n`;
            }

            summaryOutput.value = summaryText.trim();
        }

        // Exportera sammanställning till en textfil
        function exportSummary() {
            const summaryOutput = document.getElementById("summary-output").value;
            const blob = new Blob([summaryOutput], { type: "text/plain" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "kurs-sammanstallning.txt";
            link.click();
        }
    </script>
</body>
</html>
