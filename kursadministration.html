<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kursadministration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
            max-width: 800px;
            margin: auto;
            background: #f9f9f9;
            color: #333;
        }

        h1, h2 {
            text-align: center;
            color: #444;
        }

        .container {
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input, textarea, select, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        button {
            background: #28a745;
            color: white;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #218838;
        }

        .delete-button {
            background: #dc3545;
            color: white;
            margin-top: 10px;
        }

        .delete-button:hover {
            background: #c82333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border: 1px solid #ddd;
        }

        th {
            background: #f4f4f4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kursadministration</h1>

        <div class="form-group">
            <label for="new-course-name">Skapa ny kurs:</label>
            <input type="text" id="new-course-name" placeholder="Ange kursnamn (t.ex. Nybörjarkurs)">
            <input type="text" id="new-course-id" placeholder="Ange kurs-ID (t.ex. Nybörjarkurs-1)">
            <button onclick="createCourse()">Skapa kurs</button>
        </div>

        <div class="form-group">
            <label for="course-select">Välj kurs:</label>
            <select id="course-select">
                <!-- Dynamiska kurser -->
            </select>
        </div>

        <div class="form-group">
            <label for="owner-name">Ägarens namn:</label>
            <input type="text" id="owner-name" placeholder="Ange ägarens namn">
        </div>

        <div class="form-group">
            <label for="dog-name">Hundens namn:</label>
            <input type="text" id="dog-name" placeholder="Ange hundens namn">
        </div>

        <div class="form-group">
            <label for="notes">Anteckningar:</label>
            <textarea id="notes" rows="3" placeholder="Lägg till anteckningar om deltagaren"></textarea>
        </div>

        <button onclick="addParticipant()">Lägg till deltagare</button>

        <h2>Deltagare</h2>
        <table id="participant-table">
            <thead>
                <tr>
                    <th>Ägare</th>
                    <th>Hund</th>
                    <th>Anteckningar</th>
                    <th>Kurs</th>
                    <th>Åtgärd</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dynamiska rader -->
            </tbody>
        </table>
    </div>

    <script>
        const courses = JSON.parse(localStorage.getItem('courses')) || {};
        const participants = JSON.parse(localStorage.getItem('participants')) || {};

        function saveToLocalStorage() {
            localStorage.setItem('courses', JSON.stringify(courses));
            localStorage.setItem('participants', JSON.stringify(participants));
        }

        function renderCourseOptions() {
            const courseSelect = document.getElementById('course-select');
            courseSelect.innerHTML = '';

            Object.keys(courses).forEach(courseId => {
                const option = document.createElement('option');
                option.value = courseId;
                option.textContent = `${courses[courseId]} (${courseId})`;
                courseSelect.appendChild(option);
            });
        }

        function renderTable() {
            const tableBody = document.getElementById('participant-table').querySelector('tbody');
            tableBody.innerHTML = '';

            const selectedCourse = document.getElementById('course-select').value;
            if (participants[selectedCourse]) {
                participants[selectedCourse].forEach((participant, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${participant.owner}</td>
                        <td>${participant.dog}</td>
                        <td>${participant.notes}</td>
                        <td>${courses[selectedCourse]}</td>
                        <td>
                            <button class="delete-button" onclick="deleteParticipant('${selectedCourse}', ${index})">Ta bort</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }
        }

        function createCourse() {
            const courseName = document.getElementById('new-course-name').value.trim();
            const courseId = document.getElementById('new-course-id').value.trim();

            if (!courseName || !courseId) {
                alert('Ange både kursnamn och kurs-ID.');
                return;
            }

            if (courses[courseId]) {
                alert('En kurs med detta ID finns redan.');
                return;
            }

            courses[courseId] = courseName;
            participants[courseId] = [];
            saveToLocalStorage();
            renderCourseOptions();
            document.getElementById('new-course-name').value = '';
            document.getElementById('new-course-id').value = '';
            alert(`Kursen "${courseName}" har skapats!`);
        }

        function addParticipant() {
            const ownerName = document.getElementById('owner-name').value.trim();
            const dogName = document.getElementById('dog-name').value.trim();
            const notes = document.getElementById('notes').value.trim();
            const selectedCourse = document.getElementById('course-select').value;

            if (!ownerName || !dogName) {
                alert('Ange både ägarens och hundens namn.');
                return;
            }

            if (!selectedCourse) {
                alert('Välj en kurs.');
                return;
            }

            participants[selectedCourse].push({ owner: ownerName, dog: dogName, notes });
            saveToLocalStorage();
            document.getElementById('owner-name').value = '';
            document.getElementById('dog-name').value = '';
            document.getElementById('notes').value = '';
            renderTable();
        }

        function deleteParticipant(courseId, index) {
            participants[courseId].splice(index, 1);
            saveToLocalStorage();
            renderTable();
        }

        // Initiera vid sidladdning
        renderCourseOptions();
        renderTable();
    </script>
</body>
</html>
