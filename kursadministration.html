<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kursadministration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f9f9f9;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        button {
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f4f4f4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kursadministration</h1>

        <!-- Lägg till kurs -->
        <label for="course-name">Skapa ny kurs:</label>
        <input type="text" id="course-name" placeholder="Ange kursnamn">
        <button onclick="addCourse()">Lägg till kurs</button>

        <!-- Välj kurs -->
        <label for="course-select">Välj kurs:</label>
        <select id="course-select">
            <option value="">-- Välj en kurs --</option>
        </select>

        <!-- Lägg till deltagare -->
        <label for="participant-name">Deltagares namn:</label>
        <input type="text" id="participant-name" placeholder="Ange deltagares namn">
        <button onclick="addParticipant()">Lägg till deltagare</button>

        <!-- Visa deltagare -->
        <h2>Sammanställning</h2>
        <table>
            <thead>
                <tr>
                    <th>Kurs</th>
                    <th>Deltagare</th>
                </tr>
            </thead>
            <tbody id="participant-summary"></tbody>
        </table>
    </div>

    <script>
        // Lagra kurser och deltagare
        let courses = {};

        // Lägg till en ny kurs
        function addCourse() {
            const courseName = document.getElementById("course-name").value.trim();

            if (!courseName) {
                alert("Ange ett kursnamn!");
                return;
            }

            if (courses[courseName]) {
                alert("Kursen finns redan!");
                return;
            }

            courses[courseName] = [];
            document.getElementById("course-name").value = "";
            renderCourses();
            renderSummary();
            alert(`Kurs "${courseName}" har skapats!`);
        }

        // Rendera kurser i dropdown
        function renderCourses() {
            const courseSelect = document.getElementById("course-select");
            courseSelect.innerHTML = '<option value="">-- Välj en kurs --</option>';
            Object.keys(courses).forEach(courseName => {
                const option = document.createElement("option");
                option.value = courseName;
                option.textContent = courseName;
                courseSelect.appendChild(option);
            });
        }

        // Lägg till deltagare till en kurs
        function addParticipant() {
            const courseName = document.getElementById("course-select").value;
            const participantName = document.getElementById("participant-name").value.trim();

            if (!courseName) {
                alert("Välj en kurs!");
                return;
            }

            if (!participantName) {
                alert("Ange deltagares namn!");
                return;
            }

            courses[courseName].push(participantName);
            document.getElementById("participant-name").value = "";
            renderSummary();
            alert(`Deltagaren "${participantName}" har lagts till i kursen "${courseName}"!`);
        }

        // Rendera sammanställning av deltagare
        function renderSummary() {
            const participantSummary = document.getElementById("participant-summary");
            participantSummary.innerHTML = "";

            Object.keys(courses).forEach(courseName => {
                courses[courseName].forEach(participant => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${courseName}</td>
                        <td>${participant}</td>
                    `;
                    participantSummary.appendChild(row);
                });
            });
        }

        // Initiera sidan
        function init() {
            renderCourses();
            renderSummary();
        }

        init();
    </script>
</body>
</html>
